name: Build Release from Dispatch

on:
  repository_dispatch:
    types: [build-release]

permissions:
  actions: write
  contents: write

concurrency:
  group: stable-release-${{ github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  NODE_OPTIONS: '--max-old-space-size=4096'
  PNPM_STORE_PATH: ~/.pnpm-store
  APP_DIR: apps/windflow-desktop
  BUN_VERSION: '1.3.13'

jobs:
  # ============================================
  # Prepare: 解析 dispatch payload
  # ============================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      semver: ${{ steps.meta.outputs.semver }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
    steps:
      - name: Parse dispatch payload
        id: meta
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha }}
        run: |
          set -euxo pipefail
          TAG="${DISPATCH_TAG}"
          SHA="${DISPATCH_SHA}"
          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "client_payload.tag must use stable semantic version vX.Y.Z" >&2
            exit 1
          fi
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "client_payload.sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          SHORT_SHA="${SHA:0:7}"
          SEMVER="${TAG#v}"

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "semver=${SEMVER}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          echo "Tag: ${TAG}"
          echo "Semver: ${SEMVER}"
          echo "Short SHA: ${SHORT_SHA}"

      - name: Checkout private repository for validation
        uses: actions/checkout@v6
        with:
          repository: windword-labs/windflow
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ steps.meta.outputs.source_sha }}
          fetch-depth: 0
          path: source

      - name: Validate immutable source ref
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        working-directory: source
        run: |
          set -euxo pipefail
          git fetch origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/${TAG_NAME}:refs/tags/${TAG_NAME}" \
            --force

          if [ "$(git cat-file -t "refs/tags/${TAG_NAME}")" != "commit" ]; then
            echo "${TAG_NAME} must be a lightweight tag that points directly to a commit" >&2
            exit 1
          fi

          TAG_SHA="$(git rev-parse "refs/tags/${TAG_NAME}")"
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          if [ "${TAG_SHA}" != "${SOURCE_SHA}" ] || [ "${CHECKED_OUT_SHA}" != "${SOURCE_SHA}" ]; then
            echo "tag, dispatch SHA, and checked-out commit must match" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "${SOURCE_SHA}" refs/remotes/origin/main; then
            echo "${SOURCE_SHA} is not contained in windword-labs/windflow main" >&2
            exit 1
          fi

      - name: Reject an existing stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        run: |
          set -euxo pipefail
          RESPONSE_FILE="${RUNNER_TEMP}/existing-release.json"
          HTTP_STATUS="$(
            curl --silent --show-error \
              --output "${RESPONSE_FILE}" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}"
          )"

          case "${HTTP_STATUS}" in
            404)
              echo "No existing stable release for ${TAG_NAME}; retry is allowed."
              ;;
            200)
              echo "Stable release ${TAG_NAME} already exists and is immutable." >&2
              exit 1
              ;;
            *)
              cat "${RESPONSE_FILE}" >&2
              echo "Unable to verify existing release state (HTTP ${HTTP_STATUS})." >&2
              exit 1
              ;;
          esac

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          # prepare checks out windflow into ./source, so the workspace root
          # has no package.json for action-setup to read packageManager from
          package_json_file: source/package.json
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install source dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Verify stable release metadata
        env:
          SEMVER: ${{ steps.meta.outputs.semver }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
        working-directory: source
        run: |
          pnpm --filter windflow-desktop release:verify \
            --version "${SEMVER}" \
            --tag "${TAG_NAME}" \
            --output-dir "${GITHUB_WORKSPACE}/release-metadata"

      - name: Upload verified release metadata
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: release-metadata

  # ============================================
  # macOS ARM64 Build (Apple Silicon)
  # ============================================
  macos-arm64:
    needs: prepare
    runs-on: macos-latest
    env:
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      CSC_FOR_PULL_REQUEST: 'true'
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          repository: windword-labs/windflow
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Configure code signing keychain
        shell: bash
        run: |
          set -euxo pipefail
          if [ -z "${CSC_LINK_BASE64}" ]; then
            echo 'CSC_LINK_BASE64 secret is required for code signing' >&2
            exit 1
          fi
          if [ -z "${CSC_KEY_PASSWORD}" ]; then
            echo 'CSC_KEY_PASSWORD secret is required for code signing' >&2
            exit 1
          fi
          CERT_PATH="$RUNNER_TEMP/windflow-developer-id.p12"
          KEYCHAIN_NAME="windflow-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          echo "${CSC_LINK_BASE64}" | base64 --decode > "${CERT_PATH}"
          security delete-keychain "${KEYCHAIN_NAME}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security set-keychain-settings "${KEYCHAIN_NAME}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          security import "${CERT_PATH}" -k "${KEYCHAIN_NAME}" -P "${CSC_KEY_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign
          existing_keychains=$(security list-keychains -d user | sed 's/\"//g')
          security list-keychains -d user -s "${KEYCHAIN_NAME}" ${existing_keychains}
          security set-key-partition-list -S apple-tool:,apple: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_NAME}"
          echo "CSC_LINK=${CERT_PATH}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_NAME=${KEYCHAIN_NAME}" >> "${GITHUB_ENV}"
          echo "KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD}" >> "${GITHUB_ENV}"

      - name: Inspect code signing identities
        shell: bash
        run: |
          set -euxo pipefail
          security find-identity -v -p codesigning "${KEYCHAIN_NAME}" || true

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install setuptools for node-gyp
        shell: bash
        run: pip3 install setuptools --break-system-packages

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --version
          pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Build Rust CLI binary
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release -p windflow-cli --manifest-path crates/Cargo.toml
          mkdir -p apps/windflow-desktop/resources/bin
          cp crates/target/release/windflow apps/windflow-desktop/resources/bin/
          ls -lh apps/windflow-desktop/resources/bin/

      - name: Download Bun runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apps/windflow-desktop/resources/bin
          curl -fSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-aarch64.zip"
          unzip -o /tmp/bun.zip -d /tmp/bun-extract
          cp /tmp/bun-extract/bun-darwin-aarch64/bun apps/windflow-desktop/resources/bin/bun
          chmod +x apps/windflow-desktop/resources/bin/bun
          echo "Bun version: $(apps/windflow-desktop/resources/bin/bun --version)"
          rm -rf /tmp/bun.zip /tmp/bun-extract

      - name: Build project
        shell: bash
        run: |
          set -euxo pipefail
          if node -e "const p=require('./apps/windflow-desktop/package.json');process.exit(p.scripts&&p.scripts['build:with-core']?0:1)"; then
            echo 'Using build:with-core'
            pnpm --filter windflow-desktop build:with-core
          else
            echo 'build:with-core not found, fallback to build'
            pnpm --filter windflow-desktop build
          fi

      - name: Verify notarization environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is empty"
              missing=1
            else
              echo "${var} is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Package artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --filter windflow-desktop exec electron-builder --mac --arm64 --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          zip=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.zip' ! -name '*.blockmap' -print -quit || true)
          if [ -z "$zip" ]; then
            echo 'No zip artifact produced by electron-builder' >&2
            exit 1
          fi
          cp "$zip" "release/$(basename "$zip")"
          # Include metadata files
          if [ -f "$APP_DIST/latest-mac.yml" ]; then
            cp "$APP_DIST/latest-mac.yml" "release/latest-mac.yml"
          fi
          # Copy DMG and blockmap files
          find "$APP_DIST" -maxdepth 1 -type f -name '*.dmg' -exec cp {} release/ \;
          find "$APP_DIST" -maxdepth 1 -type f -name '*.blockmap' -exec cp {} release/ \;

      - name: Validate notarization
        shell: bash
        run: |
          set -euxo pipefail
          APP_DIST="${APP_DIR}/dist"
          # Try to validate zip first, then dmg
          ARCHIVE=$(find "$APP_DIST" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.dmg' \) ! -name '*.blockmap' -print -quit || true)
          if [ -z "$ARCHIVE" ]; then
            echo 'No archive artifact found to validate' >&2
            exit 1
          fi
          EXTRACT_DIR="$(mktemp -d)"
          if [[ "$ARCHIVE" == *.zip ]]; then
            ditto -x -k "$ARCHIVE" "$EXTRACT_DIR"
          else
            # For DMG, mount and copy
            hdiutil attach "$ARCHIVE" -mountpoint "$EXTRACT_DIR/mnt" -nobrowse
            cp -R "$EXTRACT_DIR/mnt"/*.app "$EXTRACT_DIR/" 2>/dev/null || true
            hdiutil detach "$EXTRACT_DIR/mnt"
          fi
          APP_PATH=$(find "$EXTRACT_DIR" -maxdepth 2 -type d -name '*.app' -print -quit || true)
          if [ -z "$APP_PATH" ]; then
            echo 'Unable to locate .app bundle within archive' >&2
            exit 1
          fi
          pnpm verify:packaged-desktop-sidecars -- --app "$APP_PATH" --require-macos-team-id
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: release

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "${KEYCHAIN_NAME}" || true
          fi

  # ============================================
  # macOS x64 Build (Intel)
  # ============================================
  macos-x64:
