          pnpm --version
          pnpm install --frozen-lockfile --config.store-dir=${{ env.PNPM_STORE_PATH }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Download universal Bun runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apps/windflow-desktop/resources/bin
          curl -fSL -o /tmp/bun-darwin-aarch64.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-aarch64.zip"
          curl -fSL -o /tmp/bun-darwin-x64.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-darwin-x64.zip"
          unzip -o /tmp/bun-darwin-aarch64.zip -d /tmp/bun-darwin-aarch64-extract
          unzip -o /tmp/bun-darwin-x64.zip -d /tmp/bun-darwin-x64-extract
          lipo -create \
            /tmp/bun-darwin-aarch64-extract/bun-darwin-aarch64/bun \
            /tmp/bun-darwin-x64-extract/bun-darwin-x64/bun \
            -output apps/windflow-desktop/resources/bin/bun
          chmod +x apps/windflow-desktop/resources/bin/bun
          lipo -archs apps/windflow-desktop/resources/bin/bun
          echo "Bun version: $(apps/windflow-desktop/resources/bin/bun --version)"
          rm -rf /tmp/bun-darwin-aarch64.zip /tmp/bun-darwin-x64.zip /tmp/bun-darwin-aarch64-extract /tmp/bun-darwin-x64-extract

      - name: Build project
        shell: bash
        run: |
          set -euxo pipefail
          if node -e "const p=require('./apps/windflow-desktop/package.json');process.exit(p.scripts&&p.scripts['build:with-core']?0:1)"; then
            echo 'Using build:with-core'
            pnpm --filter windflow-desktop build:with-core
          else
            echo 'build:with-core is required for macOS universal release builds' >&2
            exit 1
          fi

      - name: Verify notarization environment
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is empty"
              missing=1
            else
              echo "${var} is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Package universal artifacts
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --filter windflow-desktop exec electron-builder --mac --universal --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          zip=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.zip' ! -name '*.blockmap' -print -quit || true)
          if [ -z "$zip" ]; then
            echo 'No universal zip artifact produced by electron-builder' >&2
            exit 1
          fi
          cp "$zip" "release/$(basename "$zip")"
          if [ -f "$APP_DIST/latest-mac.yml" ]; then
            cp "$APP_DIST/latest-mac.yml" "release/latest-mac.yml"
          fi
          find "$APP_DIST" -maxdepth 1 -type f -name '*.dmg' -exec cp {} release/ \;
          find "$APP_DIST" -maxdepth 1 -type f -name '*.blockmap' -exec cp {} release/ \;

      - name: Validate universal notarization
        shell: bash
        run: |
          set -euxo pipefail
          APP_DIST="${APP_DIR}/dist"
          ARCHIVE=$(find "$APP_DIST" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.dmg' \) ! -name '*.blockmap' -print -quit || true)
          if [ -z "$ARCHIVE" ]; then
            echo 'No universal archive artifact found to validate' >&2
            exit 1
          fi
          EXTRACT_DIR="$(mktemp -d)"
          if [[ "$ARCHIVE" == *.zip ]]; then
            ditto -x -k "$ARCHIVE" "$EXTRACT_DIR"
          else
            hdiutil attach "$ARCHIVE" -mountpoint "$EXTRACT_DIR/mnt" -nobrowse
            cp -R "$EXTRACT_DIR/mnt"/*.app "$EXTRACT_DIR/" 2>/dev/null || true
            hdiutil detach "$EXTRACT_DIR/mnt"
          fi
          APP_PATH=$(find "$EXTRACT_DIR" -maxdepth 2 -type d -name '*.app' -print -quit || true)
          if [ -z "$APP_PATH" ]; then
            echo 'Unable to locate universal .app bundle within archive' >&2
            exit 1
          fi
          pnpm verify:packaged-desktop-sidecars -- --app "$APP_PATH" --macos-universal --require-macos-team-id
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec -vv "$APP_PATH"

      - name: Upload macOS universal artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: release

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: |
          if [ -n "${KEYCHAIN_NAME:-}" ]; then
            security delete-keychain "${KEYCHAIN_NAME}" || true
          fi

  # ============================================
  # Windows x64 Build
  # ============================================
  windows-x64:
    needs: prepare
    runs-on: windows-latest
    env:
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v6
        with:
          repository: windword-labs/windflow
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure pnpm for shorter paths
        shell: bash
        run: pnpm config set virtual-store-dir-max-length 70

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.88

      - name: Build Rust CLI binary
        shell: bash
        run: |
          set -euxo pipefail
          cargo build --release -p windflow-cli --manifest-path crates/Cargo.toml
          mkdir -p apps/windflow-desktop/resources/bin
          cp crates/target/release/windflow.exe apps/windflow-desktop/resources/bin/
          ls -lh apps/windflow-desktop/resources/bin/

      - name: Download Bun runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p apps/windflow-desktop/resources/bin
          curl -fSL -o /tmp/bun.zip \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-windows-x64.zip"
          unzip -o /tmp/bun.zip -d /tmp/bun-extract
          cp /tmp/bun-extract/bun-windows-x64/bun.exe apps/windflow-desktop/resources/bin/bun.exe
          echo "Bun downloaded: $(ls -lh apps/windflow-desktop/resources/bin/bun.exe)"
          rm -rf /tmp/bun.zip /tmp/bun-extract

      - name: Build project
        shell: bash
        run: |
          set -euxo pipefail
          if node -e "const p=require('./apps/windflow-desktop/package.json');process.exit(p.scripts&&p.scripts['build:with-core']?0:1)"; then
            echo 'Using build:with-core'
            pnpm --filter windflow-desktop build:with-core
          else
            echo 'build:with-core not found, fallback to build'
            pnpm --filter windflow-desktop build
          fi

      - name: Package artifacts
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --filter windflow-desktop exec electron-builder --win nsis msi --x64 --publish never
          mkdir -p release
          APP_DIST="${APP_DIR}/dist"
          installer=$(find "$APP_DIST" -maxdepth 1 -type f -name '*.exe' -print -quit || true)
          if [ -z "$installer" ]; then
            echo 'No Windows installer produced by electron-builder' >&2
            exit 1
          fi
          cp "$installer" "release/$(basename "$installer")"
          # Copy MSI installer
          find "$APP_DIST" -maxdepth 1 -type f -name '*.msi' -exec cp {} release/ \;
          # Include metadata files
          if [ -f "$APP_DIST/latest.yml" ]; then
            cp "$APP_DIST/latest.yml" "release/latest.yml"
          fi
          find "$APP_DIST" -maxdepth 1 -type f -name '*.blockmap' -exec cp {} release/ \;

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: release

  # ============================================
