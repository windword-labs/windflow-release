  # ============================================
  # macOS Universal Build
  # ============================================
  macos-universal:
    needs: prepare
    runs-on: macos-latest
    env:
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      CSC_FOR_PULL_REQUEST: 'true'
      CSC_LINK_BASE64: ${{ secrets.CSC_LINK_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDFLOW_AGENT_BROWSER_TARGET_PLATFORM: darwin
      WINDFLOW_AGENT_BROWSER_TARGET_ARCH: universal
      WINDFLOW_DESKTOP_SIDECAR_TARGET_PLATFORM: darwin
      WINDFLOW_DESKTOP_SIDECAR_TARGET_ARCH: universal
