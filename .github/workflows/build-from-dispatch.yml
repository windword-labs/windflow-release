  # ============================================
  # Create Release: 创建 GitHub Release
  # ============================================
  create-release:
    needs:
      - prepare
      - macos-arm64
      - macos-x64
      - macos-universal
      - windows-x64
      - linux-x64
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Use verified release metadata
        shell: bash
        run: |
          set -euxo pipefail
          test -s artifacts/release-metadata/changelog.yml
          test -s artifacts/release-metadata/release-notes.md
          cp artifacts/release-metadata/changelog.yml artifacts/changelog.yml

      - name: Merge macOS yml files
        shell: bash
        run: |
          set -euxo pipefail
          ARM64_YML="artifacts/macos-arm64/latest-mac.yml"
          X64_YML="artifacts/macos-x64/latest-mac.yml"
          UNIVERSAL_YML="artifacts/macos-universal/latest-mac.yml"
          MERGED_YML="artifacts/latest-mac.yml"

          # 收集所有 macOS yml 的 files 段
          ALL_MAC_YMLS=()
          for f in "$ARM64_YML" "$X64_YML" "$UNIVERSAL_YML"; do
            [ -f "$f" ] && ALL_MAC_YMLS+=("$f")
          done

          if [ "${#ALL_MAC_YMLS[@]}" -gt 1 ]; then
            echo "Merging ${#ALL_MAC_YMLS[@]} latest-mac.yml files..."
            FIRST="${ALL_MAC_YMLS[0]}"

            VERSION=$(grep "^version:" "$FIRST" | head -1)
            RELEASE_DATE=$(grep "^releaseDate:" "$FIRST" | head -1)
            PATH_LINE=$(grep "^path:" "$FIRST" | head -1)
            SHA512_LINE=$(grep "^sha512:" "$FIRST" | head -1)

            echo "$VERSION" > "$MERGED_YML"
            echo "files:" >> "$MERGED_YML"
            for f in "${ALL_MAC_YMLS[@]}"; do
              awk '/^files:/{flag=1; next} /^[a-zA-Z]/ && flag{flag=0} flag' "$f" >> "$MERGED_YML"
            done
            echo "$PATH_LINE" >> "$MERGED_YML"
            echo "$SHA512_LINE" >> "$MERGED_YML"
            echo "$RELEASE_DATE" >> "$MERGED_YML"

            echo "Merged latest-mac.yml:"
            cat "$MERGED_YML"

            rm -f "$ARM64_YML" "$X64_YML" "$UNIVERSAL_YML"
          elif [ "${#ALL_MAC_YMLS[@]}" -eq 1 ]; then
            echo "Only one macOS yml found, moving to artifacts root"
            mv "${ALL_MAC_YMLS[0]}" "$MERGED_YML"
          fi

          # Windows 的 latest.yml 移动到 artifacts 根目录
          WIN_YML="artifacts/windows-x64/latest.yml"
          if [ -f "$WIN_YML" ]; then
            mv "$WIN_YML" "artifacts/latest.yml"
          fi

          # Linux 的 latest-linux.yml 移动到 artifacts 根目录
          LINUX_YML="artifacts/linux-x64/latest-linux.yml"
          if [ -f "$LINUX_YML" ]; then
            mv "$LINUX_YML" "artifacts/latest-linux.yml"
          fi

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euxo pipefail
          assets_file="release-assets.txt"

          # 收集根目录的 yml 文件（已合并）
          find artifacts -maxdepth 1 -type f -name '*.yml' -print > "$assets_file"

          # 收集所有子目录的其他文件（zip, exe, AppImage, blockmap 等）
          find artifacts -mindepth 2 -type f \( \
            -name '*.zip' -o \
            -name '*.dmg' -o \
            -name '*.exe' -o \
            -name '*.msi' -o \
            -name '*.AppImage' -o \
            -name '*.blockmap' \
          \) -print >> "$assets_file"

          sort -o "$assets_file" "$assets_file"

          if [ ! -s "$assets_file" ]; then
            echo 'No eligible release assets were found' >&2
            exit 1
          fi

          cat "$assets_file"
          echo "assets_file=$assets_file" >> "$GITHUB_OUTPUT"

      - name: Finalize release notes
        shell: bash
        run: |
          set -euxo pipefail
          RELEASE_TIME="$(date -u '+%Y-%m-%d %H:%M:%SZ')"
          cp artifacts/release-metadata/release-notes.md release-notes.md

          cat >> release-notes.md << EOF

          ---

          Released at: ${RELEASE_TIME}
          Source commit: https://github.com/windword-labs/windflow/commit/${SOURCE_SHA}
          Build run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})

          ### Downloads

          | Platform | Download |
          |----------|----------|
          | macOS (Apple Silicon) | ✅ |
          | macOS (Intel) | ✅ |
          | macOS (Universal) | ✅ |
          | Windows (x64 NSIS) | ✅ |
          | Windows (x64 MSI) | ✅ |
          | Linux (x64) | ✅ |
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSETS_FILE: ${{ steps.assets.outputs.assets_file }}
        shell: bash
        run: |
          set -euxo pipefail

          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < "${ASSETS_FILE}"

          if gh release view "${TAG_NAME}" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "Stable release ${TAG_NAME} already exists and is immutable." >&2
            exit 1
          fi

          gh release create "${TAG_NAME}" "${assets[@]}" \
            --repo ${{ github.repository }} \
            --title "WindFlow ${TAG_NAME}" \
            --notes-file release-notes.md

          RELEASE_URL="$(gh release view "${TAG_NAME}" --repo ${{ github.repository }} --json url --jq '.url')"
          gh workflow run notify-discord-release.yml \
            --repo ${{ github.repository }} \
            --ref main \
            -f release_tag="${TAG_NAME}" \
            -f release_name="WindFlow ${TAG_NAME}" \
            -f release_url="${RELEASE_URL}" \
            -f release_prerelease=false

      - name: Trigger landing page revalidation
        if: success()
        shell: bash
        run: |
          curl -sf "https://www.windflow.app/api/revalidate?secret=${{ secrets.REVALIDATE_SECRET }}" || echo "::warning::Landing page revalidation failed (non-blocking)"

  # ============================================
  # Cleanup: 清理 artifacts
  # ============================================
  cleanup:
    needs:
      - create-release
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Clean up artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          echo "Cleaning up artifacts from this run..."
          for id in $(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts --jq '.artifacts[].id'); do
            echo "Deleting artifact $id..."
            gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
          done
          echo "Artifacts cleaned up"
